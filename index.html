<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Data Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Division Data Library</h1>
            <p class="subtitle">Quick access to documents, tools, and resources</p>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="M21 21l-4.35-4.35"></path>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search resources...">
            </div>

            <div id="categoryTabs" class="category-tabs"></div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading resources...</p>
        </div>

        <div id="error" class="error" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <p id="errorMessage">Failed to load resources.</p>
        </div>

        <div id="noResults" class="no-results" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="M21 21l-4.35-4.35"></path>
            </svg>
            <p>No resources found.</p>
        </div>

        <div id="iconsGrid" class="icons-grid"></div>

        <div id="resultCount" class="result-count" style="display: none;"></div>
    </main>

    <footer class="footer">
        <p>Powered by Google Sheets</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/sheets.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
